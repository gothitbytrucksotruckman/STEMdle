<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>STEMdle</title>
        <link rel="icon" type="image/png" href="assets/html logo.png" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            rel="stylesheet"
            href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
        />
        <link rel="stylesheet" href="style.css" />
        <!-- Apply saved theme before first paint to avoid a flash -->
        <script>
            try {
                const t = localStorage.getItem('stemdle_theme');
                if (t) document.documentElement.dataset.theme = t;
            } catch (e) {}
        </script>
    </head>
    <body>
        <!-- SVG icon sprite — one defs block, referenced via <use href="#i-..."> -->
        <svg style="display: none" aria-hidden="true">
            <symbol id="i-menu" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="3" y1="6" x2="21" y2="6" />
                <line x1="3" y1="12" x2="21" y2="12" />
                <line x1="3" y1="18" x2="21" y2="18" />
            </symbol>
            <symbol id="i-x" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="18" y1="6" x2="6" y2="18" />
                <line x1="6" y1="6" x2="18" y2="18" />
            </symbol>
            <symbol id="i-chart" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="6" y1="20" x2="6" y2="14" />
                <line x1="12" y1="20" x2="12" y2="10" />
                <line x1="18" y1="20" x2="18" y2="4" />
            </symbol>
            <symbol id="i-flame" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 3c2 3 5 5 5 9a5 5 0 0 1-10 0c0-1.5.5-2.5 1.5-3.5.3 1 .8 1.5 1.5 1.5 1 0 1.5-1 1.5-2.5C11.5 6 11 4.5 12 3z" />
            </symbol>
            <symbol id="i-dice" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="3" width="18" height="18" rx="3" />
                <circle cx="8" cy="8" r="1.2" fill="currentColor" stroke="none" />
                <circle cx="16" cy="8" r="1.2" fill="currentColor" stroke="none" />
                <circle cx="12" cy="12" r="1.2" fill="currentColor" stroke="none" />
                <circle cx="8" cy="16" r="1.2" fill="currentColor" stroke="none" />
                <circle cx="16" cy="16" r="1.2" fill="currentColor" stroke="none" />
            </symbol>
            <symbol id="i-lock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="5" y="11" width="14" height="10" rx="2" />
                <path d="M8 11 V8 a4 4 0 0 1 8 0 v3" />
            </symbol>
            <symbol id="i-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="20 6 9 17 4 12" />
            </symbol>
            <symbol id="i-xmark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <line x1="18" y1="6" x2="6" y2="18" />
                <line x1="6" y1="6" x2="18" y2="18" />
            </symbol>
            <symbol id="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="4" />
                <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41" />
            </symbol>
            <symbol id="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" />
            </symbol>
            <symbol id="i-arrow-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="5" y1="12" x2="19" y2="12" />
                <polyline points="12 5 19 12 12 19" />
            </symbol>
            <symbol id="i-arrow-left" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="19" y1="12" x2="5" y2="12" />
                <polyline points="12 19 5 12 12 5" />
            </symbol>
            <symbol id="i-share" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="18" cy="5" r="3" />
                <circle cx="6" cy="12" r="3" />
                <circle cx="18" cy="19" r="3" />
                <line x1="8.6" y1="13.5" x2="15.4" y2="17.5" />
                <line x1="15.4" y1="6.5" x2="8.6" y2="10.5" />
            </symbol>
        </svg>

        <header class="site-header">
            <button
                id="menu-btn"
                class="icon-btn"
                aria-label="Open menu"
                aria-expanded="false"
                aria-controls="sidebar"
            >
                <svg class="icon" aria-hidden="true"><use href="#i-menu" /></svg>
            </button>
            <a href="./" class="brand" aria-label="STEMdle home">
                <img src="assets/logo stemdle fixed.png" alt="STEMdle" width="120" height="73" />
            </a>
            <span class="header-spacer" aria-hidden="true"></span>
        </header>

        <!-- Sidebar Menu -->
        <div id="sidebar-overlay" class="sidebar-overlay hidden"></div>
        <aside id="sidebar" class="sidebar hidden" aria-label="Menu">
            <p class="sidebar-title">Menu</p>
            <button id="sidebar-stats-btn" class="sidebar-link">
                <svg class="icon" aria-hidden="true"><use href="#i-chart" /></svg>
                Stats
            </button>
            <button id="theme-btn" class="sidebar-link">
                <svg class="icon" aria-hidden="true"><use href="#i-moon" /></svg>
                <span>Dark mode</span>
            </button>
        </aside>

        <!-- Landing / Mode Select -->
        <main id="view-landing" class="view">
            <div class="page-intro">
                <h1>Choose your discipline</h1>
                <p class="lede">
                    One hint to start. Every wrong guess unlocks another.
                </p>
            </div>
            <div id="section-buttons" class="section-grid"></div>
        </main>

        <!-- Level Select -->
        <main id="view-levels" class="view hidden">
            <div class="game-header">
                <button id="levels-back-btn" class="link-btn">
                    <svg class="icon" aria-hidden="true"><use href="#i-arrow-left" /></svg>
                    Back
                </button>
                <span id="levels-section-label" class="crumb"></span>
            </div>
            <div id="levels-list"></div>
        </main>

        <!-- Game Screen -->
        <main id="view-game" class="view hidden">
            <div class="game-header">
                <button id="back-btn" class="link-btn">
                    <svg class="icon" aria-hidden="true"><use href="#i-arrow-left" /></svg>
                    Back
                </button>
                <span id="puzzle-label" class="crumb"></span>
            </div>

            <section id="hint-panel" class="card">
                <h2 class="card-title">Hints</h2>
                <ol id="hints-list"></ol>
            </section>

            <section id="search-area" class="card">
                <label for="search-input" class="card-title">Your guess</label>
                <div class="search-input-group">
                    <input
                        type="text"
                        id="search-input"
                        placeholder="Type to search terms…"
                        autocomplete="off"
                        aria-describedby="guess-error"
                    />
                    <button id="submit-guess-btn" class="accent-btn">Submit</button>
                </div>
                <p id="guess-error" class="field-error" role="alert"></p>
                <div id="search-results" aria-label="Matching terms"></div>
                <button id="give-up-btn" class="danger-btn">Give up</button>
            </section>

            <section id="guess-history" class="card">
                <h2 class="card-title" role="status">
                    Guesses <span id="guess-count" class="count-pill">0</span>
                </h2>
                <ul id="guess-list"></ul>
            </section>
        </main>

        <!-- Result Screen -->
        <main id="view-result" class="view hidden">
            <div class="result-card card">
                <h1 id="result-title"></h1>
                <div id="result-answer"></div>
                <div id="result-tier"></div>
                <div id="result-detail"></div>
                <div class="result-actions">
                    <button id="share-btn" class="accent-btn">
                        <svg class="icon" aria-hidden="true"><use href="#i-share" /></svg>
                        Share
                    </button>
                    <button id="play-again-btn" class="outline-btn">Pick another level</button>
                </div>
            </div>
        </main>

        <!-- Stats Screen -->
        <main id="view-stats" class="view hidden">
            <div class="game-header">
                <button id="stats-back-btn" class="link-btn">
                    <svg class="icon" aria-hidden="true"><use href="#i-arrow-left" /></svg>
                    Back
                </button>
                <span class="crumb">My Stats</span>
            </div>
            <div id="stats-content"></div>
        </main>

        <footer class="site-footer">
            <p>STEMdle &copy; 2026. Developed by Rangga Arsandy.</p>
        </footer>

        <dialog id="giveup-dialog" aria-labelledby="giveup-title">
            <form method="dialog">
                <h2 id="giveup-title">Give up?</h2>
                <p>The answer will be revealed and this round won't count toward your streak.</p>
                <div class="dialog-actions">
                    <button value="cancel" class="outline-btn" autofocus>Keep guessing</button>
                    <button value="confirm" class="danger-solid-btn">Reveal answer</button>
                </div>
            </form>
        </dialog>

        <div id="toast" class="toast hidden" role="status">Copied to clipboard</div>

        <script src="app.js"></script>
    </body>
</html>
